openapi: 3.1.0
info:
  title: Fábrica Abstracta S.A.C.S. — Facturación electrónica
  version: 2.2.0
  description: 'API por cuenta autenticada. Emisión y bajas durables: 202 significa solicitud reservada, no aceptación
    SUNAT. Consultar emissionStatus, communicationStatus y cancellationStatus. PEN/USD/EUR; factura y boleta nacionales,
    notas de crédito 01/02/03/04/05/06/07/09/13, débito 01/02. Las empresas se aíslan por accountId del token; el
    RUC puede repetirse entre cuentas. Sin límite comercial de empresas o establecimientos. Validación fiscal local
    y XSD no sustituyen la CDR real.'
  x-sunat-rules: https://cpe.sunat.gob.pe/guias-y-manuales
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
tags:
- name: Autenticación
- name: Sesiones
- name: Empresas
- name: Comprobantes
- name: Anulación
- name: Notas de crédito
- name: Notas de débito
- name: Cobranzas
- name: Ventas V2
