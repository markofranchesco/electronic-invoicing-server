  /v2/companies/{documentNumber}/sales:
    post:
      tags:
      - Ventas V2
      operationId: saveSaleV2
      summary: Registrar venta, emitir y obtener PDF
      description: 'Venta directa: no requiere confirmación ni send. Persiste la intención y orquesta emisión y
        PDF. Espera hasta SALES_WAIT_TIMEOUT_MS (10000 por defecto) por el trabajo externo. 200 devuelve PDF; 202
        informa demora con ID y recoveryUrl. Nunca crea otra venta por agotarse la espera. No enviar send:false.'
      parameters:
      - name: documentNumber
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{11}$
      - name: format
        in: query
        schema:
          type: string
          enum:
          - A4
          - TICKET_48
          - TICKET_50
          - TICKET_54
          - TICKET_55
          - TICKET_58
          - TICKET_80
          default: TICKET_80
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleRequest'
      responses:
        '200':
          description: 'PDF listo para imprimir. No equivale a aceptación SUNAT: comprobar X-Emission-Status y estado
            impreso. Incluye X-Document-Id y Location.'
          headers:
            X-Document-Id:
              schema:
                type: string
                format: uuid
            X-Emission-Status:
              schema:
                type: string
            Location:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '202':
          description: Emisión demorada. Devuelve mensaje, documentId, recoveryUrl y estado interno; la venta no
            se cancela.
          headers:
            Location:
              schema:
                type: string
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleOperationResponse'
        '409':
          description: 'Rechazo, anulación o revisión manual: se devuelve el estado del documento. Conflictos de
            idempotencia/estado pueden devolver problem+json.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleOperationResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '400':
          description: Entrada inválida.
        '401':
          description: Autenticación requerida.
        '404':
          description: Venta o empresa no encontrada en la cuenta.
        '422':
          description: Regla fiscal o de negocio inválida.
