components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token opaco de sesión; no es un JWT.
  schemas:
    SignUpRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 1
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
      required:
      - email
      - password
    SignInRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 1
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
      required:
      - email
      - password
    CompanyUpsertRequest:
      type: object
      additionalProperties: false
      properties:
        specialIgvFrom:
          type: string
          format: date
          description: Inicio de elegibilidad verificada por el contribuyente para la Ley 31556; requiere specialIgvUntil.
        specialIgvUntil:
          type: string
          format: date
          description: Fin inclusivo de elegibilidad. No sustituye verificar requisitos ni padrón SUNAT.
        legalName:
          type: string
          maxLength: 250
          minLength: 1
        tradeName:
          type: string
          maxLength: 255
        email:
          type: string
          maxLength: 254
          minLength: 1
          format: email
        address:
          $ref: '#/components/schemas/Address'
        taxpayerType:
          $ref: '#/components/schemas/TaxpayerType'
        taxCredentials:
          $ref: '#/components/schemas/TaxCredentials'
        digitalCertificate:
          $ref: '#/components/schemas/DigitalCertificate'
        logoBase64:
          type:
          - string
          - 'null'
          maxLength: 699052
          description: Logo opcional de esta empresa. PNG/JPEG Base64 puro, hasta 512 KiB y 2048 x 2048 píxeles.
            Null o vacío elimina el logo.
      required:
      - taxpayerType
      - legalName
      - email
      - address
      - taxCredentials
      - digitalCertificate
      description: Datos de TaxpayerEntity para crear o actualizar una empresa. Dirección, credenciales y certificado
        mantienen su estructura anidada.
    Address:
      type: object
      additionalProperties: false
      properties:
        street:
          type: string
          minLength: 1
          maxLength: 250
        geographicCode:
          $ref: '#/components/schemas/UbigeoCode'
        department:
          type: string
          maxLength: 100
          minLength: 1
          description: Nombre del departamento que corresponde al geographicCode; no es un código SUNAT independiente.
            Debe coincidir con el registro INEI del catálogo 13.
        province:
          type: string
          maxLength: 100
          minLength: 1
          description: Nombre del provincia que corresponde al geographicCode; no es un código SUNAT independiente.
            Debe coincidir con el registro INEI del catálogo 13.
        district:
          type: string
          maxLength: 100
          minLength: 1
          description: Nombre del distrito que corresponde al geographicCode; no es un código SUNAT independiente.
            Debe coincidir con el registro INEI del catálogo 13.
        countryCode:
          $ref: '#/components/schemas/PeruCountryCode'
      required:
      - street
      - geographicCode
      - department
      - province
      - district
      - countryCode
    CompanyResponse:
      type: object
      additionalProperties: false
      properties:
        specialIgvFrom:
          type:
          - string
          - 'null'
          format: date
          description: Inicio de elegibilidad verificada por el contribuyente para la Ley 31556; requiere specialIgvUntil.
        specialIgvUntil:
          type:
          - string
          - 'null'
          format: date
          description: Fin inclusivo de elegibilidad. No sustituye verificar requisitos ni padrón SUNAT.
        id:
          type: string
          format: uuid
        legalName:
          type: string
        tradeName:
          type:
          - string
          - 'null'
        email:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        taxpayerType:
          $ref: '#/components/schemas/TaxpayerType'
        accountId:
          type: string
          format: uuid
        taxCredentialsConfigured:
          type:
          - boolean
          - 'null'
          readOnly: true
          description: Indica si existen credenciales de envío configuradas. No revela usuario ni contraseña.
        digitalCertificateConfigured:
          type:
          - boolean
          - 'null'
          readOnly: true
          description: Indica si se configuró el certificado de firma. No revela el material PKCS#12 ni su contraseña.
        logoBase64:
          type:
          - string
          - 'null'
          maxLength: 699052
          description: Logo opcional de esta empresa. PNG/JPEG Base64 puro, hasta 512 KiB y 2048 x 2048 píxeles.
            Null o vacío elimina el logo.
        documentNumber:
          type: string
          pattern: ^[0-9]{11}$
          description: RUC de la empresa de la cuenta autenticada.
      description: Datos públicos/operativos de la empresa. Las credenciales SOL, claves y certificado privado solo
        se admiten en operaciones de escritura y nunca se devuelven.
      required:
      - id
      - accountId
      - taxpayerType
      - legalName
      - email
    DocumentUpsertRequest:
      type: object
      additionalProperties: false
      properties:
        documentType:
          $ref: '#/components/schemas/SalesDocumentType'
        series:
          type: string
          pattern: ^[FB][A-Z0-9]{3}$
        issueDate:
          type:
          - string
          - 'null'
          format: date
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        taxRegime:
          type: string
          enum:
          - GENERAL
          - MYPE_HOSPITALITY
        establishment:
          $ref: '#/components/schemas/Establishment'
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentItem'
          minItems: 1
          maxItems: 500
        paymentType:
          type: string
          enum:
          - Contado
          - Credito
        pendingAmount:
          type:
          - string
          - 'null'
          pattern: ^[0-9]{1,12}(\.[0-9]{1,2})?$
        installments:
          type: array
          items:
            $ref: '#/components/schemas/Installment'
          minItems: 1
          maxItems: 999
        operationType:
          $ref: '#/components/schemas/OperationType'
        detraction:
          $ref: '#/components/schemas/Detraction'
        externalReference:
          type: string
          maxLength: 100
        observations:
          type: string
          maxLength: 500
        exchangeRate:
          type: string
          pattern: ^[0-9]{1,12}(\.[0-9]{1,6})?$
      required:
      - documentType
      - series
      - issueDate
      - currency
      - items
      - operationType
      description: Factura requiere customer con RUC y paymentType. Crédito exige saldo positivo igual a cuotas,
        vencimientos posteriores a emisión. Boleta >S/700 requiere identificar al cliente. Fecha local Lima, máximo
        3 días atrás para serie F y 7 para B. Elegibilidad del IGV especial verificada en la empresa. exchangeRate
        obligatorio para boletas extranjeras, ICBPER o detracción en moneda extranjera.
    DocumentApiResponse:
      type: object
      additionalProperties: false
      description: Consulta operativa; emissionStatus es el estado interno completo. status agrupa CREATED/SIGNED/ACCEPTED/REJECTED/ANNULLED.
        No interpretar SIGNED como aceptado por SUNAT.
      required:
      - id
      - taxpayerId
      - documentType
      - series
      - number
      - status
      - issueDate
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        taxpayerId:
          type: string
          format: uuid
        documentType:
          $ref: '#/components/schemas/DocumentType'
        series:
          type: string
          minLength: 4
          maxLength: 4
        number:
          type: integer
          format: int64
          minimum: 1
        status:
          $ref: '#/components/schemas/DocumentStatus'
        externalReference:
          type:
          - string
          - 'null'
          maxLength: 255
        issueDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        sunatCode:
          type:
          - string
          - 'null'
          description: Código de respuesta fiscal recibido para este documento, si existe.
        sunatDescription:
          type:
          - string
          - 'null'
          description: Descripción de respuesta SUNAT, si existe.
        cdrAvailable:
          type:
          - boolean
          - 'null'
          description: Indica si está disponible el archivo CDR descargable.
        xmlAvailable:
          type:
          - boolean
          - 'null'
          description: Indica si está disponible el archivo XML firmado.
        referenceDocument:
          $ref: '#/components/schemas/OriginalDocumentReference'
        reasonCode:
          $ref: '#/components/schemas/CreditNoteReasonCode'
        emissionStatus:
          type:
          - string
          - 'null'
          description: 'HELD: guardado sin autorización de emisión; no lo procesa el conciliador. DRAFT: autorizado
            y pendiente de preparación. SUBMITTED: enviado, todavía sin aceptación confirmada.'
        communicationReference:
          type:
          - string
          - 'null'
        communicationStatus:
          type:
          - string
          - 'null'
        communicationTicket:
          type:
          - string
          - 'null'
        acceptedAt:
          type:
          - string
          - 'null'
          format: date-time
        grantedAt:
          type:
          - string
          - 'null'
          format: date-time
        acceptanceDeadlineBase:
          type:
          - string
          - 'null'
          format: date-time
        acceptanceDateSource:
          type:
          - string
          - 'null'
        reconciliation:
          $ref: '#/components/schemas/ReconciliationState'
        establishment:
          $ref: '#/components/schemas/Establishment'
        cancellationStatus:
          type:
          - string
          - 'null'
      allOf:
      - if:
          required:
          - documentType
          properties:
            documentType:
              const: '07'
        then:
          required:
          - referenceDocument
          - reasonCode
        else:
          not:
            anyOf:
            - required:
              - referenceDocument
            - required:
              - reasonCode
    CancellationRequest:
      type: object
      additionalProperties: false
      properties:
        procedure:
          type: string
          enum:
          - COMMUNICATION_BAJA
          - DAILY_SUMMARY_VOID
        reason:
          type: string
          minLength: 1
          maxLength: 250
        notGranted:
          type: boolean
        previousReference:
          type: string
          pattern: ^(RA|RC)-[0-9]{8}-[0-9]{1,5}$
      required:
      - procedure
      - reason
      - notGranted
    CancellationApiResponse:
      type: object
      additionalProperties: false
      required:
      - sunatCode
      - sunatDescription
      description: Resultado de una comunicación de baja o de resumen diario de anulación. La recepción del pedido
        202 no implica aceptación SUNAT.
      properties:
        sunatCode:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+$
          description: Código recibido de SUNAT; en el CDR, 0 indica aceptación y un código distinto indica rechazo.
            No es el reasonCode enviado al solicitar la anulación.
        sunatDescription:
          type:
          - string
          - 'null'
          description: Descripción de SUNAT, incluido el motivo del rechazo; null si todavía no se recibió.
        status:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
          format: uuid
        documentId:
          type:
          - string
