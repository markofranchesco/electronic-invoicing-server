  /sign-up:
    post:
      operationId: signup
      tags:
      - Autenticación
      summary: Crear cuenta
      responses:
        '200':
          description: Cuenta creada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Entrada inválida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token ausente o inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Recurso no encontrado en la cuenta.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Estado incompatible o conflicto de versión/idempotencia.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Regla de negocio o fiscal no satisfecha.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '502':
          description: Respuesta externa inválida o indisponible.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      security: []
